<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redactle Word Groups</title>
  <link rel="stylesheet" href="styles.css">
  <script src="core.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body class="popup">
  <main>
    <h1>Redactle Word Groups</h1>
    <label for="group">Word group</label>
    <select id="group" disabled></select>
    <p id="summary" class="hint"></p>
    <div class="row">
      <button id="start" class="primary" disabled>Guess all</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <progress id="progress" value="0" max="1" hidden></progress>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="settings">Manage groups &amp; settings</button>
    <p class="hint">Batches continue when this popup closes. Keep the puzzle tab open and avoid typing guesses during a batch.</p>
  </main>
</body>
</html>
